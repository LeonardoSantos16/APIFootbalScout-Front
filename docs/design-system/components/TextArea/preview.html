<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextArea</title></head>
<body style="margin:0;background:var(--ground)">
<div id="root" class="sv-stage is-column"></div>
<script>
  var V = window.ScoutVestiario, h = React.createElement;
  function Demo() {
    var s = React.useState('Boa leitura de jogo entre as linhas; recebe de costas e gira rápido. Perde intensidade no segundo tempo.');
    return h('div', { style: { display: 'grid', gap: '20px', background: 'var(--surface)', padding: '24px', borderRadius: 'var(--radius-lg)', maxWidth: '520px' } },
      h(V.TextArea, { label: 'Relato', value: s[0], onChange: function (e) { s[1](e.target.value); } }),
      h(V.TextArea, { label: 'Relato', rows: 3, defaultValue: '', error: 'Escreva o relato.' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
