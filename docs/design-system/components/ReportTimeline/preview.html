          { id: 'r3', title: 'Correção de 05/11/2026', detail: '7,5 de 10 · Contratar', status: 'current', href: '#' },
          { id: 'r4', title: 'Correção de 12/11/2026', detail: 'Sem nota · Sem parecer', status: 'draft', href: '#' }
