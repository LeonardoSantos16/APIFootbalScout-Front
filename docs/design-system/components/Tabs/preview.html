<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tabs</title></head>
<body style="margin:0;background:var(--ground)">
<div id="root" class="sv-stage is-column"></div>
<script>
  var V = window.ScoutVestiario, h = React.createElement;
  var player = [
    { id: 'perfil', label: 'Perfil', href: '#perfil' },
    { id: 'metricas', label: 'Métricas', href: '#metricas' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(function Demo() {
  var s = React.useState('serie');
  return h(React.Fragment, null,
    h(V.Tabs, { ariaLabel: 'Jogador', value: 'perfil', items: player }),
    h(V.Tabs, { ariaLabel: 'Jogador', value: 'perfil', items: player, disabled: true }),
    h(V.Tabs, { ariaLabel: 'Seção', value: s[0], onChange: s[1], items: [
      { id: 'serie', label: 'Rascunhos' },
      { id: 'copa', label: 'Finalizados' },
      { id: 'selecao', label: 'Correções', count: 4 }
    ] }));
}));
</script>
</body>
</html>
