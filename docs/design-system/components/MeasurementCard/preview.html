<!-- @dsCard group="Acompanhamento" height=190 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MeasurementCard</title></head>
<body style="margin:0;background:var(--ground)">
<div id="root" class="sv-stage is-column"></div>
<script>
  var V = window.ScoutVestiario, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px' } },
  h(V.MeasurementCard, { title: 'Valor de mercado', state: 'ComMudanca', previous: '€8,0M', current: '€9,0M', change: { direction: 'up', text: '+12,5% valor de mercado' } }),
  h(V.MeasurementCard, { title: 'Clube', state: 'SemMudancaRelevante', current: 'Mesmo clube' }),
  h(V.MeasurementCard, { title: 'Minutagem', state: 'Indisponivel', reason: 'A temporada virou e a minutagem zerou. A leitura antiga não é comparável.' })));
</script>
</body>
</html>
