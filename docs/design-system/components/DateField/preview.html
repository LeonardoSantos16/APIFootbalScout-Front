<!doctype html>
<html>
<head><meta charset="utf-8"><title>DateField</title></head>
<body style="margin:0;background:var(--ground)">
<div id="root" class="sv-stage is-column"></div>
<script>
  var V = window.ScoutVestiario, h = React.createElement;
  function Demo() {
    var s = React.useState('2026-11-24');
    return h('div', { style: { display: 'grid', gap: '20px', background: 'var(--surface)', padding: '24px', borderRadius: 'var(--radius-lg)', maxWidth: '400px' } },
      h(V.DateField, { label: 'Data da observação', value: s[0], max: '2026-11-24', onChange: s[1] }),
      h(V.DateField, { label: 'Data da observação', value: '2026-11-24', readOnly: true, hint: 'A data da observação não muda depois de salvar.' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
