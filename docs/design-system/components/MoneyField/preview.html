<!doctype html>
<html>
<head><meta charset="utf-8"><title>MoneyField</title></head>
<body style="margin:0;background:var(--ground)">
<div id="root" class="sv-stage is-column"></div>
<script>
  var V = window.ScoutVestiario, h = React.createElement;
  function Demo() {
    var a = React.useState('12,5'), c = React.useState('EUR');
    return h('div', { style: { display: 'grid', gap: '24px', background: 'var(--surface)', padding: '24px', borderRadius: 'var(--radius-lg)', maxWidth: '440px' } },
      h(V.MoneyField, { value: a[0], onChange: a[1], currency: c[0], onCurrencyChange: c[1], hint: 'O primeiro alvo define a moeda da lista.' }),
      h(V.MoneyField, { value: '8', currency: 'EUR', lockedCurrency: true, hint: 'A moeda da lista é EUR.' }),
      h(V.MoneyField, { value: '0', currency: 'EUR', lockedCurrency: true, error: 'Informe um custo maior que zero.' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
