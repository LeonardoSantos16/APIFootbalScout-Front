<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField</title></head>
<body style="margin:0;background:var(--ground)">
<div id="root" class="sv-stage is-column"></div>
<script>
  var V = window.ScoutVestiario, h = React.createElement;
  function Demo() {
    var s = React.useState('');
    return h('div', { style: { display: 'grid', gap: '20px', background: 'var(--surface)', padding: '24px', borderRadius: 'var(--radius-lg)', maxWidth: '400px' } },
      h(V.TextField, { label: 'Nome', autoComplete: 'name', value: s[0], onChange: function (e) { s[1](e.target.value); } }),
      h(V.TextField, { label: 'E-mail', type: 'email', defaultValue: 'ana.ribeiro', error: 'Informe um e-mail válido.' }),
      h(V.TextField, { label: 'E-mail', type: 'email', defaultValue: 'ana.ribeiro@exemplo.com', disabled: true }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
